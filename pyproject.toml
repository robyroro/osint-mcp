[project]
name = "osint-mcp-server"
version = "0.3.0"
description = "OSINT investigations for domains and websites: public lookups, infrastructure comparison, batch recon and source-backed reports"
readme = "README.md"
license = "MIT"
authors = [{ name = "Robert Vind-Gardoș" }]
requires-python = ">=3.10"
keywords = ["mcp", "osint", "recon", "whois", "dns", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Internet :: Name Service (DNS)",
]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27,<1",
    "dnspython>=2.6,<3",
    "tldextract>=5.3,<6",
]

[project.urls]
Repository = "https://github.com/robyroro/osint-mcp"
Author = "https://stratagency.ro/en/robert-vind-gardos"

[project.scripts]
osint-mcp = "osint_mcp.server:main"
# so `uvx osint-mcp-server` works without --from
osint-mcp-server = "osint_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/osint_mcp"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<1", "build>=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
