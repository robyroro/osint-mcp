[project]
name = "osint-mcp"
version = "0.1.0"
description = "MCP server with passive OSINT lookups (RDAP, DNS, crt.sh, Wayback, Shodan InternetDB)"
readme = "README.md"
license = "MIT"
authors = [{ name = "robyroro" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "dnspython>=2.6",
]

[project.urls]
Repository = "https://github.com/robyroro/osint-mcp"

[project.scripts]
osint-mcp = "osint_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
