[project]
name = "osint-mcp-server"
version = "0.2.0"
description = "MCP server for passive OSINT recon: whois, DNS, CT logs, email security, TLS, ASN, Wayback, Shodan InternetDB"
readme = "README.md"
license = "MIT"
authors = [{ name = "robyroro" }]
requires-python = ">=3.10"
keywords = ["mcp", "osint", "recon", "whois", "dns", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Internet :: Name Service (DNS)",
]
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "dnspython>=2.6",
]

[project.urls]
Repository = "https://github.com/robyroro/osint-mcp"

[project.scripts]
osint-mcp = "osint_mcp.server:main"
# so `uvx osint-mcp-server` works without --from
osint-mcp-server = "osint_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/osint_mcp"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
